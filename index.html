<!DOCTYPE html>
<html lang="es">
<head>

    <title>LifeInvader - Intranet</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .header { background-color: #cc0000; width: 100%; padding: 20px; text-align: center; color: white; position: absolute; top: 0; font-weight: bold; font-size: 24px; }
